<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" role="img" aria-label="Three colorful game cards building a show">
<defs>
 <radialGradient id="halo"><stop stop-color="#FD68E4" stop-opacity=".22"/><stop offset="1" stop-color="#FD68E4" stop-opacity="0"/></radialGradient>
 <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF8DEB"/><stop offset=".55" stop-color="#FD4DC1"/><stop offset="1" stop-color="#BA4FDF"/></linearGradient>
 <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7BEFFA"/><stop offset="1" stop-color="#219EE2"/></linearGradient>
